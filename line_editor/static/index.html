<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line Editor</title>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/styles.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="app-header">
  <h1>Line Editor</h1>
</header>
<div class="layout">
  <nav aria-label="Documents" class="docs">
    <div class="docs-actions">
      <button type="button" id="new-doc">New document</button>
      <button type="button" id="load-sample" class="secondary">Load sample</button>
    </div>
    <p id="list-empty" class="muted">No saved documents yet.</p>
    <ul id="doc-list" class="doc-list"></ul>
  </nav>
  <main class="editor">
    <form id="editor-form" novalidate autocomplete="off">
      <div class="field">
        <label for="doc-title">Document title</label>
        <input type="text" id="doc-title" name="title" autocomplete="off">
        <p class="count" id="title-count">0 / 120</p>
      </div>
      <div class="field">
        <label for="doc-text">Document text</label>
        <textarea id="doc-text" name="text" spellcheck="false" wrap="off" autocomplete="off"></textarea>
        <p class="count" id="text-count">1 line, 0 / 262144 bytes</p>
      </div>
      <div class="actions">
        <button type="submit" id="save">Save</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="error" role="alert" hidden></div>
      <div id="conflict-actions" class="actions" hidden>
        <button type="button" id="save-copy">Save as copy</button>
        <button type="button" id="load-latest" class="secondary">Load latest</button>
      </div>
    </form>
  </main>
</div>
</body>
</html>
